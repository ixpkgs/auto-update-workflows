name: Update Go module

on:
  workflow_call:
    inputs:
      upstream_repository:
        description: Git repository whose release tags should be packaged
        required: true
        type: string
      package_name:
        description: Package name used in logs and commit messages
        required: true
        type: string
      tag_pattern:
        description: Bash regular expression used to select release tags
        required: false
        type: string
        default: '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
      flake_file:
        description: Repository-relative path to the Nix flake
        required: false
        type: string
        default: flake.nix
      build_target:
        description: Nix installable to build
        required: false
        type: string
        default: .#default

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BUILD_TARGET: ${{ inputs.build_target }}
      FLAKE_FILE: ${{ inputs.flake_file }}
      PACKAGE_NAME: ${{ inputs.package_name }}
      TAG_PATTERN: ${{ inputs.tag_pattern }}
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
      UPSTREAM_REPOSITORY: ${{ inputs.upstream_repository }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Package new upstream tags
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C

          if [[ -z "$PACKAGE_NAME" || -z "$UPSTREAM_REPOSITORY" || -z "$TAG_PATTERN" ]]; then
            echo "package_name, upstream_repository, and tag_pattern must not be empty." >&2
            exit 1
          fi

          if [[ ! -f "$FLAKE_FILE" ]] || ! git ls-files --error-unmatch -- "$FLAKE_FILE" >/dev/null 2>&1; then
            echo "flake_file must identify a tracked regular file: $FLAKE_FILE" >&2
            exit 1
          fi

          tag_count=$(grep -Ec '^[[:space:]]*tag = "[^"]+";' -- "$FLAKE_FILE" || true)
          commit_count=$(grep -Ec '^[[:space:]]*commit = "[0-9a-f]+";' -- "$FLAKE_FILE" || true)
          vendor_hash_count=$(grep -Ec '^[[:space:]]*vendorHash = "sha256-[^"]+";' -- "$FLAKE_FILE" || true)

          if (( tag_count != 1 || commit_count != 1 || vendor_hash_count != 1 )); then
            printf '%s\n' \
              "Expected exactly one tag, commit, and vendorHash assignment in $FLAKE_FILE." \
              "Found: tag=$tag_count commit=$commit_count vendorHash=$vendor_hash_count" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          upstream_refs=$(git ls-remote --tags "$UPSTREAM_REPOSITORY")
          mapfile -t pending_releases < <(
            # Prefer peeled commits for annotated tags. Lightweight tags only
            # produce the unpeeled line, whose value is already a commit.
            awk '
              $2 ~ /^refs\/tags\// {
                ref = $2
                peeled = sub(/\^\{\}$/, "", ref)
                tag = substr(ref, length("refs/tags/") + 1)
                if (!(tag in commits) || peeled) {
                  commits[tag] = $1
                }
              }
              END {
                for (tag in commits) {
                  printf "%s\t%s\n", tag, commits[tag]
                }
              }
            ' <<< "$upstream_refs" |
            while IFS=$'\t' read -r tag commit; do

              if [[ ! "$tag" =~ $TAG_PATTERN ]]; then
                continue
              fi

              # Values are substituted into flake.nix with sed below. Keep that
              # operation unambiguous even when callers provide a broad pattern.
              if [[ ! "$tag" =~ ^[0-9A-Za-z._+-]+$ ]]; then
                echo "Ignoring unsafe tag: $tag" >&2
                continue
              fi

              if ! git show-ref --verify --quiet "refs/tags/$tag"; then
                printf '%s\t%s\n' "$tag" "$commit"
              fi
            done | sort -V -k1,1
          )

          if (( ${#pending_releases[@]} == 0 )); then
            echo "No new $PACKAGE_NAME tags found."
            exit 0
          fi

          printf 'New %s tags (oldest first):\n' "$PACKAGE_NAME"
          printf '  %s\n' "${pending_releases[@]%%$'\t'*}"

          for release in "${pending_releases[@]}"; do
            IFS=$'\t' read -r tag commit <<< "$release"

            if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid commit for $tag: $commit" >&2
              exit 1
            fi

            echo "Packaging $tag ($commit)"
            sed -i -E \
              -e "s|^([[:space:]]*)tag = \"[^\"]+\";|\1tag = \"$tag\";|" \
              -e "s|^([[:space:]]*)commit = \"[0-9a-f]+\";|\1commit = \"$commit\";|" \
              -e 's|^([[:space:]]*)vendorHash = "sha256-[^"]+";|\1vendorHash = pkgs.lib.fakeHash;|' \
              -- "$FLAKE_FILE"

            grep -Fq -- "tag = \"$tag\";" "$FLAKE_FILE"
            grep -Fq -- "commit = \"$commit\";" "$FLAKE_FILE"
            grep -Fq -- 'vendorHash = pkgs.lib.fakeHash;' "$FLAKE_FILE"

            set +e
            build_output=$(nix build "$BUILD_TARGET" --no-link 2>&1)
            build_status=$?
            set -e

            if (( build_status == 0 )); then
              echo "The build unexpectedly succeeded with pkgs.lib.fakeHash." >&2
              exit 1
            fi

            vendor_hash=$(
              sed -nE \
                's/^[[:space:]]*got:[[:space:]]+(sha256-[A-Za-z0-9+\/=]+).*$/\1/p' \
                <<< "$build_output" | tail -n 1
            )

            if [[ -z "$vendor_hash" ]]; then
              printf '%s\n' "$build_output" >&2
              echo "Could not determine vendorHash for $tag." >&2
              exit 1
            fi

            sed -i -E \
              "s|^([[:space:]]*)vendorHash = pkgs\.lib\.fakeHash;|\1vendorHash = \"$vendor_hash\";|" \
              -- "$FLAKE_FILE"

            nix build "$BUILD_TARGET" --no-link
            git diff --check
            git add -- "$FLAKE_FILE"
            git commit \
              -m "Package $PACKAGE_NAME $tag" \
              -m "Upstream commit: $commit"
            git tag "$tag"

            # Persist each release independently. If a later build fails, the
            # successfully packaged earlier releases remain available.
            git push --atomic origin \
              "HEAD:refs/heads/$TARGET_BRANCH" \
              "refs/tags/$tag"
          done
